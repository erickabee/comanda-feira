name: Testes
on:
  push:
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-24.04  # Playwright 1.56 ainda não suporta o Ubuntu 26.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regras de negócio
        run: npm test
      - name: Navegador para os testes de tela
        run: npx playwright install --with-deps chromium
      - name: Telas em celular e tablet
        run: npm run test:e2e
